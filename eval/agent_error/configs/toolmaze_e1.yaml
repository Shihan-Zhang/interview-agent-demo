# E1 正式实验:按官方设置复现 ToolMaze C1(P0–P4 × 100 题),本地 qwen3i-8k
# 用官方 run_eval.py 与官方提示词,便于和论文对比;E2 改用自己的适配脚本控制提示词。judge 段保留,但官方判分是纯规则,不会调用

agent:
  type: "vllm"                         # 即 OpenAI 兼容接口;Ollama 的 /v1 也是这个协议
  model: "qwen3i-8k"                   # scripts/e0_setup.ps1 第 5 步建立:num_ctx 固定 8192
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  temperature: 0.7                     # Qwen3-Instruct-2507 官方推荐值(与 compare_local.py 一致)
  max_tokens: 2048                     # 官方 32000;本地 8192 上下文下必须给输入留空间

judge:
  model: "${JUDGE_MODEL}"              # .env 里设置,默认 deepseek-ai/DeepSeek-V3.2;与被测 Qwen 不同家族,避免同源偏差
  temperature: 0                       # 官方为 1;裁判要可复现,用 0
  api_key: "${SILICONFLOW_API_KEY}"
  base_url: "${SILICONFLOW_BASE_URL}"

execution:
  max_rounds: 25
  timeout_per_round: 1000

data:
  task_dir: "data/perturbed_tasks/c1"
  output_dir: "../results/e1"          # 即 external/agent_error/results/e1(相对 toolmaze 目录)
  task_category: "c1"
  tools_dir: "tools"
  template_dir: "data/templates"

evaluation:
  modes: ["P0", "P1", "P2", "P3", "P4"]
  parallel: false                      # 本地 Ollama 一次只处理一个请求,并发只会制造排队
  max_workers: 1
  save_traces: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
